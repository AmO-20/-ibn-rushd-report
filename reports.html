<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أرشيف التقارير | مدارس ابن رشد</title>
<style>
:root{--green:#397438;--dark:#285c2d;--gold:#d7b66b;--bg:#eef4ec;--line:#dce7d8}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#edf4eb,#f7f7ef);font-family:Tahoma,Arial,sans-serif;color:#243528;line-height:1.8}
header{background:linear-gradient(135deg,#245b36,#397438 58%,#6c9a58);color:#fff;text-align:center;padding:22px 12px;border-bottom:6px solid var(--gold)}
header h1{margin:0;font-size:clamp(1.35rem,4vw,2rem)}
header p{margin:5px 0 0}
main{max-width:980px;margin:22px auto;padding:0 14px 40px}
.card{background:#fff;border:1px solid var(--line);border-top:4px solid #c6d9b9;border-radius:15px;padding:18px;margin:15px 0;box-shadow:0 7px 22px #21452b0d}
h2{color:var(--dark);margin:0 0 12px}
input,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #bdcdb8}
input{width:100%;margin:5px 0 12px;background:#fff}
button{cursor:pointer;background:var(--green);color:#fff;border:0;padding:10px 17px}
button.secondary{background:#eaf2e7;color:var(--dark);border:1px solid #d5e3d0}
button:disabled{opacity:.6;cursor:wait}
.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
.filters label{font-weight:bold;color:var(--dark)}
.report{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0;box-shadow:0 5px 18px #21452b0b}
.report-head{background:#f4f8f1;border-right:5px solid var(--green);padding:12px;border-radius:9px;margin-bottom:16px}
.report-head h2{margin:0 0 5px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.meta div{background:#fff;border:1px solid #e5ede1;border-radius:8px;padding:8px}
.section-title{background:linear-gradient(100deg,#2e6634,#4c8544);color:white;padding:11px 14px;border-radius:9px;margin:20px 0 12px;font-size:1.15rem}
.item{background:#f8faf6;border:1px solid #e2ebde;border-right:4px solid #8bad7e;border-radius:9px;padding:11px 13px;margin:9px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.item b{display:block;color:#285c2d;margin-bottom:3px}
.clean-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}
.clean{background:#f8faf6;border:1px solid #e2ebde;border-radius:9px;padding:11px}
.clean b{display:block;color:#285c2d}
.level{font-weight:bold;color:#397438}
.edu{border:1px solid #e2ebde;border-radius:10px;padding:12px;margin:10px 0;background:#fbfcfa}
.edu h4{margin:0 0 6px;color:#285c2d}
.edu p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.photos{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.photos a{display:block}
.photos img{width:min(100%,260px);max-height:230px;object-fit:cover;border-radius:10px;border:2px solid #dce7d8}
.muted{color:#647365}
.status{padding:10px;border-radius:8px;margin:10px 0;white-space:pre-wrap}
.error{background:#fff0f0;color:#8b2525}
.empty{text-align:center;color:#697969;padding:24px}
.hidden{display:none!important}
footer{text-align:center;color:#718071;padding:20px}
@media(max-width:600px){.filters{grid-template-columns:1fr}.card{padding:13px}}
</style>
</head>
<body>
<header>
<h1>مدارس ابن رشد</h1>
<p>أرشيف التقرير اليومي عن سير العملية التعليمية · جازان</p>
</header>
<main>
<section id="login" class="card">
<h2>تسجيل الدخول إلى أرشيف التقارير</h2>
<label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني"></label>
<label>كلمة المرور<input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"></label>
<button id="loginBtn" onclick="unlock()">دخول</button>
<div id="loginMsg" class="muted" aria-live="polite"></div>
</section>

<section id="content" class="hidden">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
<h2 style="margin:0">أرشيف التقارير المحفوظة</h2>
<button class="secondary" onclick="logout()">تسجيل الخروج</button>
</div>
<div class="filters">
<label>البحث<input id="search" type="search" placeholder="اسم المعد أو الموقع أو التاريخ" oninput="renderReports()"></label>
<label>تصفية حسب التاريخ<input id="filterDate" type="date" onchange="renderReports()"></label>
<button class="secondary" onclick="loadReports()">تحديث التقارير</button>
</div>
<div id="pageMsg" class="muted" aria-live="polite"></div>
</div>
<div id="reports"></div>
</section>
</main>
<footer>مدارس ابن رشد • التقرير اليومي</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://wikhapgreyavzwcrzinf.supabase.co';
const SUPABASE_KEY='sb_publishable_ju_7EAtCyAC-nTOhIfSg2w_hq_3N4YI';
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
let reports=[];

const $=id=>document.getElementById(id);
function setMsg(id,message,isError=false){
  const el=$(id); el.textContent=message||''; el.className=isError?'status error':'muted';
}
window.unlock=async function(){
  const email=$('email').value.trim(), password=$('password').value;
  if(!email||!password){setMsg('loginMsg','أدخل البريد الإلكتروني وكلمة المرور.',true);return;}
  $('loginBtn').disabled=true; setMsg('loginMsg','جارٍ التحقق من الحساب...');
  const {error}=await db.auth.signInWithPassword({email,password});
  $('loginBtn').disabled=false;
  if(error){setMsg('loginMsg','تعذر تسجيل الدخول: '+error.message,true);return;}
  $('login').classList.add('hidden'); $('content').classList.remove('hidden');
  await loadReports();
};
window.logout=async function(){
  await db.auth.signOut(); reports=[];
  $('content').classList.add('hidden'); $('login').classList.remove('hidden');
  $('password').value=''; $('reports').replaceChildren();
  setMsg('loginMsg','تم تسجيل الخروج.');
};
function text(parent,tag,value,className){
  const el=document.createElement(tag); el.textContent=value??'—';
  if(className)el.className=className; parent.append(el); return el;
}
function addItem(parent,title,value){
  if(value===undefined||value===null||value==='')return;
  const box=document.createElement('div');box.className='item';
  text(box,'b',title);text(box,'div',String(value));parent.append(box);
}
function parseData(row){
  try{return typeof row.report_details==='string'?JSON.parse(row.report_details):(row.report_details||{});}
  catch{return {};}
}
function displayValue(v){
  if(v===undefined||v===null||v==='')return '—';
  if(typeof v==='boolean')return v?'نعم':'لا';
  if(Array.isArray(v))return v.map(x=>{
    if(x&&typeof x==='object')return Object.entries(x).filter(([k,val])=>val!==''&&val!==null&&val!==undefined).map(([k,val])=>String(val)).join(' — ');
    return String(x);
  }).join('، ')||'—';
  if(typeof v==='object')return Object.entries(v).map(([k,val])=>k+': '+displayValue(val)).join('\n');
  return String(v);
}
function section(parent,title){
  return text(parent,'h3',title,'section-title');
}
async function addImages(parent,paths){
  if(!Array.isArray(paths)||!paths.length)return;
  const wrap=document.createElement('div');wrap.className='photos';
  for(const path of paths){
    if(!path)continue;
    const {data,error}=await db.storage.from('school-reports').createSignedUrl(path,3600);
    if(error||!data?.signedUrl)continue;
    const a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.rel='noopener';
    const img=document.createElement('img');img.src=data.signedUrl;img.alt='صورة مرفقة بالتقرير';img.loading='lazy';
    a.append(img);wrap.append(a);
  }
  if(wrap.children.length)parent.append(wrap);
}
function renderOne(row){
  const d=parseData(row);
  const card=document.createElement('article');card.className='report';
  const head=document.createElement('div');head.className='report-head';
  text(head,'h2','تقرير يوم '+(d.reportDate||row.report_date||'—'));
  const meta=document.createElement('div');meta.className='meta';
  for(const [label,value] of [['معد التقرير',d.reporter],['الموقع داخل المدرسة',d.location||row.location],['الفترة',d.shift]]){
    const cell=document.createElement('div');text(cell,'b',label);text(cell,'span',displayValue(value));meta.append(cell);
  }
  head.append(meta);card.append(head);

  section(card,'متابعة النظافة');
  const cleanGrid=document.createElement('div');cleanGrid.className='clean-grid';
  const cleanItems=Array.isArray(d.cleanlinessLocations)?d.cleanlinessLocations:[];
  cleanItems.forEach(item=>{
    const cell=document.createElement('div');cell.className='clean';
    text(cell,'b',item.name||'بند النظافة');
    text(cell,'div',item.state||'لم يتم تحديد المستوى','level');
    cleanGrid.append(cell);
  });
  if(cleanGrid.children.length)card.append(cleanGrid);
  addItem(card,'وصف المخالفة',d.violations);
  addItem(card,'ملاحظة تود ذكرها',d.cleanNotes);
  addImages(card,row.image_paths);

  section(card,'المشكلات السلوكية والتربوية');
  if(d.assaultType)addItem(card,'نوع الاعتداء',d.assaultType);
  const combined=[d.studentNames,d.classes].filter(x=>x&&String(x).trim()).join('\n');
  addItem(card,'أسماء الطلاب والفصول',combined);
  addItem(card,'عدد الغياب بعذر وبدون عذر',d.absenceDescription);
  addItem(card,'الانضباط الصفي',d.discipline);

  section(card,'الجوانب التربوية');
  const education=Array.isArray(d.educationAnswers)?d.educationAnswers:[];
  if(education.length){
    education.forEach((item,index)=>{
      const box=document.createElement('div');box.className='edu';
      text(box,'h4',item.question||('البند '+(index+1)));
      text(box,'p',item.answer||'لا توجد ملاحظات مسجلة');
      card.append(box);
    });
  }else{
    const fallback=[
      ['المعلمين الغائبين لهذا اليوم',d.absentTeachers],
      ['المعلمين المتأخرين لهذا اليوم',d.lateTeachers]
    ];
    fallback.forEach(([k,v])=>addItem(card,k,v));
  }
  return card;
}
window.renderReports=function(){
  const host=$('reports');host.replaceChildren();
  const query=$('search').value.trim().toLowerCase(), date=$('filterDate').value;
  const filtered=reports.filter(row=>{
    const d=parseData(row);
    const reportDate=d.reportDate||row.report_date||'';
    const hay=[reportDate,d.reporter,d.location,row.location].join(' ').toLowerCase();
    return (!date||reportDate===date)&&(!query||hay.includes(query));
  });
  if(!filtered.length){text(host,'div','لا توجد تقارير مطابقة للبحث.','empty');return;}
  filtered.forEach(row=>host.append(renderOne(row)));
  // Add signed images after cards are in the document.
  filtered.forEach((row,i)=>addImages(host.children[i],row.image_paths));
};
window.loadReports=async function(){
  setMsg('pageMsg','جارٍ تحميل التقارير...');
  const {data,error}=await db.from('school_reports').select('*').order('report_date',{ascending:false});
  if(error){setMsg('pageMsg','تعذر تحميل التقارير: '+error.message,true);return;}
  reports=data||[];setMsg('pageMsg','عدد التقارير: '+reports.length);
  renderReports();
};
const {data:{session}}=await db.auth.getSession();
if(session){$('login').classList.add('hidden');$('content').classList.remove('hidden');await loadReports();}
</script>
</body>
</html>
